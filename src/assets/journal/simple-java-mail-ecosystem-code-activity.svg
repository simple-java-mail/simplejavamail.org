<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title description">
  <title id="title">Code activity across the Simple Java Mail ecosystem</title>
  <desc id="description">Stacked monthly bars show active project-weeks across eleven repositories from April 2009 through August 2026. Long quiet periods are visible from 2012 to 2015 and from 2025 to 2026.</desc>
  <metadata>Monthly aggregation of GitHub Code frequency CSV exports downloaded 6 September 2026. A project-week counts when additions or deletions are nonzero. Repository-wide data; not author-filtered commit counts.</metadata>
